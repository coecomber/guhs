# Compiles Guhs and builds the jar on every push and pull request.
# (The GameTest server is too heavy for CI: run `./gradlew runGameTestServer` locally before a release.)
name: Build

on:
  push:
    branches: [ main, mc26 ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java version of this branch (build.gradle toolchain, 21 on main and 25 on mc26)
        id: java
        run: echo "version=$(grep -oE 'JavaLanguageVersion\.of\([0-9]+\)' build.gradle | grep -oE '[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up Java ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # only the main and mc26 branches write the cache; PRs read it
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/mc26' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: guhs-jar
          path: build/libs/guhs-*.jar
          if-no-files-found: error
          retention-days: 14
