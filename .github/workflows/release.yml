# Publishes a Guhs release when you push a tag like v1.0.0:
#   builds the jar, creates the GitHub Release (with the jar), and uploads it to CurseForge and Modrinth.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   Secrets:   CURSEFORGE_TOKEN   (CurseForge -> account -> API tokens)
#              MODRINTH_TOKEN     (Modrinth -> Settings -> PATs, scopes: Create versions + Read projects + Write projects)
#   Variables: CURSEFORGE_PROJECT_ID   (the number shown as "Project ID" on the CurseForge project page)
#              MODRINTH_PROJECT_ID     (the project ID from the Modrinth project page, e.g. "AbCd1234")
#
# The tag must match mod_version in gradle.properties (tag v1.0.0 <-> mod_version=1.0.0), otherwise the job stops.
# The release notes are the section "## <version>" of CHANGELOG.md.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Read and check the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          MOD_VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "tag=$TAG version=$VERSION mod_version=$MOD_VERSION"
          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Tag $TAG does not match mod_version=$MOD_VERSION in gradle.properties"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          mkdir -p build
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "Guhs ${{ steps.version.outputs.version }}" > build/release-notes.md
          fi
          cat build/release-notes.md

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build the jar
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          ls -la build/libs
          test -f "build/libs/guhs-${{ steps.version.outputs.version }}.jar"

      - name: Publish to GitHub, CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # GitHub Release (created for the tag)
          github-tag: ${{ steps.version.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # CurseForge
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Modrinth
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          files: build/libs/guhs-${{ steps.version.outputs.version }}.jar
          name: Guhs ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: build/release-notes.md

          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            geckolib(required){modrinth:8BmcQJ2H}{curseforge:388172}

          retry-attempts: 3
          retry-delay: 10000
