# Builds the Guhs wiki site and publishes it on GitHub Pages.
#
# Decision: CI does NOT re-render images. tools/wiki_renders.py (thousands of 3D renders, minutes of CPU) is run
# locally, and its output docs/wiki/img/ is committed. This workflow only runs tools/make_wiki_site.py, which turns
# the committed pictures + the tools/ data into the static site in docs/site/ (docs/site/ itself is git-ignored).
# So: after changing the mod's looks, run `python tools/wiki_renders.py docs/wiki/img` locally and commit the images.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Wiki (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/wiki/**'
      - 'docs/screenshots/**'
      - 'tools/**'
      - 'src/main/resources/assets/guhs/lang/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/requirements-wiki.txt

      - name: Install wiki dependencies
        run: pip install -r tools/requirements-wiki.txt

      - name: Build the wiki site (uses the committed images, no re-render)
        run: python tools/make_wiki_site.py --base-url https://coecomber.github.io/guhs/

      - name: Check the site exists
        run: |
          test -f docs/site/index.html || { echo "docs/site/index.html is missing"; exit 1; }
          touch docs/site/.nojekyll
          du -sh docs/site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
