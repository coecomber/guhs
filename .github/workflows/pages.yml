# Builds the site of https://guhs.nl/ and publishes it on GitHub Pages:
#   docs/site/           the landing page (index.html), 404.html (sends old wiki links /<page>.html on to /wiki/<page>.html),
#                        CNAME (guhs.nl), robots.txt, sitemap.xml   <- tools/wiki_site/landing.py
#   docs/site/wiki/      the Guhs wiki                               <- the rest of tools/wiki_site/
# Both come out of one run of tools/make_wiki_site.py, which also checks every link (landing -> wiki too).
#
# Custom domain: with "GitHub Actions" as the Pages source the CNAME file in the artifact is not what sets the domain;
# set it once in Settings -> Pages -> Custom domain (guhs.nl) and turn on "Enforce HTTPS". The CNAME file is kept as a
# record (and for a branch-based setup). Once guhs.nl is set, GitHub sends coecomber.github.io/guhs/<x> to guhs.nl/<x>,
# and the root 404.html sends that on to guhs.nl/wiki/<x>.
#
# Decision: CI does NOT re-render images. tools/wiki_renders.py (thousands of 3D renders, minutes of CPU) is run
# locally, and its output docs/wiki/img/ is committed. This workflow only runs tools/make_wiki_site.py, which turns
# the committed pictures + the tools/ data into the static site in docs/site/ (docs/site/ itself is git-ignored).
# So: after changing the mod's looks, run `python tools/wiki_renders.py docs/wiki/img` locally and commit the images.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Wiki (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/wiki/**'
      - 'docs/screenshots/**'
      - 'tools/**'
      - 'src/main/resources/assets/guhs/lang/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/requirements-wiki.txt

      - name: Install wiki dependencies
        run: pip install -r tools/requirements-wiki.txt

      - name: Build the landing page + wiki (uses the committed images, no re-render)
        run: python tools/make_wiki_site.py --base-url https://guhs.nl/wiki/ --landing docs/site --out docs/site/wiki

      - name: Check the site exists
        run: |
          for f in index.html 404.html CNAME wiki/index.html wiki/server.html wiki/aan-de-slag.html; do
            test -f "docs/site/$f" || { echo "docs/site/$f is missing"; exit 1; }
          done
          grep -qx 'guhs.nl' docs/site/CNAME || { echo "docs/site/CNAME must say guhs.nl"; exit 1; }
          touch docs/site/.nojekyll
          du -sh docs/site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
